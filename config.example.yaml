# Public demo configuration. Copy to config.yaml to use with the web UI.
# Mock returns fixed synthetic data; configure a real VLM in the web settings.
provider:
  name: mock
  openai_compat:
    base_url: ""
    model: ""
    api_key_env: VISION_API_KEY
    temperature: 0.0
    max_tokens: 4096
    timeout: 300
    retries: 2
assembly:
  enabled: false
inspection:
  enabled: false
recognition:
  prompt_version: v5
  preserve_printed_rows: true
  # 按版面定位坐标裁切标题栏/明细表区域后一并送模型；定位失败退回四象限裁切
  detail_crops: true
  region_crops: true
knowledge:
  enabled: true
  path: data/knowledge/engine_rules.txt
output:
  dir: data/predictions
  formats: [json, csv]
